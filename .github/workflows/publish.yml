# npm auto-publish: cut a GitHub Release (tag v*), CI tests, then publishes to npm.
#
# One-time setup on your side (≈2 minutes):
#   1. npmjs.com → Access Tokens → Generate New Token → "Granular Access Token"
#      - Packages: Read and write
#      - Scope:    only `oliphant`
#   2. GitHub repo → Settings → Secrets and variables → Actions →
#      New repository secret → name: NPM_TOKEN → paste the token.
#   3. Done. Every GitHub Release now ships to npm automatically.
#
# Releasing:
#   git tag v0.1.0 && git push origin v0.1.0
#   # or: gh release create v0.1.0 --title "v0.1.0 — first stampede"
name: publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm --provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Test before publishing
        run: node --test
      - name: Publish
        run: |
          # keep package.json version in lockstep with the git tag
          JSTAG="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$JSTAG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $JSTAG — bump it first."
            exit 1
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
